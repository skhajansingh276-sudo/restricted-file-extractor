<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DrivePDF Master | Premium Extraction Studio</title>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary: #6366f1;
            --primary-glow: rgba(99, 102, 241, 0.4);
            --bg: #0f172a;
            --card-bg: rgba(30, 41, 59, 0.7);
            --text: #f8fafc;
            --text-dim: #94a3b8;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Outfit', sans-serif;
        }

        body {
            background: var(--bg);
            color: var(--text);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            overflow-x: hidden;
            background-image: 
                radial-gradient(circle at 20% 20%, rgba(99, 102, 241, 0.15) 0%, transparent 40%),
                radial-gradient(circle at 80% 80%, rgba(139, 92, 246, 0.15) 0%, transparent 40%);
        }

        .container {
            width: 100%;
            max-width: 800px;
            padding: 2rem;
            z-index: 10;
        }

        header {
            text-align: center;
            margin-bottom: 3rem;
        }

        h1 {
            font-size: 3.5rem;
            font-weight: 800;
            background: linear-gradient(135deg, #fff 0%, #6366f1 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 0.5rem;
        }

        .glass-card {
            background: var(--card-bg);
            backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 24px;
            padding: 3rem;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
        }

        input[type="text"] {
            width: 100%;
            background: rgba(15, 23, 42, 0.6);
            border: 2px solid rgba(99, 102, 241, 0.2);
            border-radius: 16px;
            padding: 1.25rem 1.5rem;
            color: #fff;
            margin-bottom: 2rem;
            outline: none;
        }

        .btn-extract {
            width: 100%;
            background: var(--primary);
            color: #fff;
            border: none;
            border-radius: 16px;
            padding: 1.25rem;
            font-size: 1.1rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        #status-area {
            margin-top: 2rem;
            display: none;
        }

        .progress-container {
            width: 100%;
            height: 10px;
            background: rgba(255, 255, 255, 0.05);
            border-radius: 10px;
            overflow: hidden;
            margin-bottom: 1rem;
        }

        .progress-bar {
            width: 0%;
            height: 100%;
            background: linear-gradient(90deg, #6366f1, #a855f7);
            transition: width 0.5s ease;
        }

        .status-text {
            color: var(--text-dim);
            font-size: 0.9rem;
            text-align: center;
            display: block;
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1>DrivePDF Master</h1>
            <p style="color: #94a3b8">Premium extraction studio for Vercel</p>
        </header>

        <div class="glass-card">
            <input type="text" id="url-input" placeholder="Paste Google Drive link here...">
            <button class="btn-extract" id="extract-btn">Start Extraction</button>

            <div id="status-area">
                <div class="progress-container">
                    <div class="progress-bar" id="progress-bar"></div>
                </div>
                <span class="status-text" id="status-message">Initializing...</span>
            </div>
        </div>
    </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    <script>
        const extractBtn = document.getElementById('extract-btn');
        const urlInput = document.getElementById('url-input');
        const statusArea = document.getElementById('status-area');
        const progressBar = document.getElementById('progress-bar');
        const statusMessage = document.getElementById('status-message');

        extractBtn.addEventListener('click', async () => {
            const url = urlInput.value.trim();
            if (!url) return alert('Please enter a URL');

            statusArea.style.display = 'block';
            progressBar.style.width = '10%';
            statusMessage.innerText = 'Connecting to Cloud Engine...';
            extractBtn.disabled = true;

            try {
                const response = await fetch('/api/extract', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ url })
                });

                const data = await response.json();
                if (data.error) throw new Error(data.error);

                statusMessage.innerText = `Found ${data.pages} pages. Downloading assets...`;
                progressBar.style.width = '40%';

                const { jsPDF } = window.jspdf;
                const pdf = new jsPDF();
                
                for (let i = 0; i < data.images.length; i++) {
                    statusMessage.innerText = `Processing page ${i + 1}/${data.images.length}...`;
                    const imgData = await getBase64Image(data.images[i]);
                    if (i > 0) pdf.addPage();
                    
                    const imgProps = pdf.getImageProperties(imgData);
                    const pdfWidth = pdf.internal.pageSize.getWidth();
                    const pdfHeight = (imgProps.height * pdfWidth) / imgProps.width;
                    
                    pdf.addImage(imgData, 'JPEG', 0, 0, pdfWidth, pdfHeight);
                    progressBar.style.width = `${40 + (i / data.images.length) * 60}%`;
                }

                pdf.save('extracted_document.pdf');
                statusMessage.innerText = 'Success! Document Downloaded.';
                
            } catch (err) {
                statusMessage.innerText = 'Error: ' + err.message;
                statusMessage.style.color = '#ef4444';
            } finally {
                extractBtn.disabled = false;
            }
        });

        async function getBase64Image(url) {
            const response = await fetch(`https://api.allorigins.win/raw?url=${encodeURIComponent(url)}`);
            const blob = await response.blob();
            return new Promise((resolve, reject) => {
                const reader = new FileReader();
                reader.onloadend = () => resolve(reader.result);
                reader.onerror = reject;
                reader.readAsDataURL(blob);
            });
        }
    </script>
</body>
</html>
